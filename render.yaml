services:
  - type: web
    name: blackstone-online
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_DATABASE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: blackstone-db
          property: connectionString

# DEMO ONLY: Render's Free Postgres expires after 30 days. Upgrade before
# storing player accounts you need to keep.
databases:
  - name: blackstone-db
    databaseName: blackstone
    user: blackstone
    plan: free
    region: oregon
